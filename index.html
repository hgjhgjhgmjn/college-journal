
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Journal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root {
  --bg:#101116;
  --panel:#191b24;
  --panel2:#222531;
  --text:#f2f2f7;
  --muted:#9295a5;
  --accent:#8b7cf6;
  --green:#35c98a;
  --red:#ed6577;
  --border:#303341;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header {
  padding:18px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
header h1 {margin:0;font-size:23px}
header p {color:var(--muted);margin:5px 0 0}
nav {
  display:flex;
  gap:8px;
  padding:12px;
  overflow-x:auto;
  background:var(--panel);
}
button {
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:var(--panel2);
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
}
nav button.active,.primary {
  background:var(--accent);
  color:white;
}
main {max-width:950px;margin:auto;padding:20px}
h2 {font-size:21px}
h3 {font-size:17px}
.muted,.small {color:var(--muted)}
.small {font-size:12px}
.cards {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card,.item {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}
.card strong {
  font-size:27px;
  display:block;
  margin:7px 0;
}
.item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:15px 0;
}
input,select {
  background:var(--panel2);
  border:1px solid var(--border);
  color:white;
  padding:12px;
  border-radius:9px;
  width:100%;
  margin:7px 0 12px;
}
label {color:var(--muted);font-size:13px}
.present {color:var(--green)}
.absent {color:var(--red)}
.progress {
  height:9px;
  background:var(--panel2);
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}
.progress div {
  height:100%;
  background:var(--green);
}
.hidden {display:none}
.auth {
  max-width:400px;
  margin:50px auto;
  padding:22px;
  background:var(--panel);
  border-radius:16px;
  border:1px solid var(--border);
}
.notice {
  background:var(--panel2);
  padding:12px;
  border-radius:10px;
  margin:12px 0;
}
button:disabled {opacity:.5;cursor:not-allowed}
.filters {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.language {
  width:auto;
  margin:0;
  padding:9px;
}
.stat-line {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--border);
}
.absence-item {
  border-left:3px solid var(--red);
}

/* Кнопки посещаемости */
.attendance-row {
  display:flex;
  flex-wrap:nowrap !important;
  align-items:center !important;
  justify-content:space-between;
  gap:10px;
}
.attendance-name {
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}
.attendance-controls {
  display:flex;
  gap:7px;
  flex-shrink:0;
}
.mark-btn {
  width:39px;
  height:39px;
  min-width:39px;
  padding:0;
  border:2px solid var(--border);
  border-radius:9px;
  background:var(--panel2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:bold;
  transition:background .15s,transform .15s;
}
.mark-btn.present-btn.active {
  background:var(--green);
  border-color:var(--green);
  color:#101116;
}
.mark-btn.absent-btn.active {
  background:var(--red);
  border-color:var(--red);
  color:white;
}
.mark-btn:active {transform:scale(.93)}
.export-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin:16px 0;
}
.export-card h3 {margin-top:0}
.export-card button {width:100%;margin-top:5px}
.export-fields {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.export-fields>div {min-width:0}
.export-note {
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin:5px 0 12px;
}
@media(max-width:550px) {
  main {padding:14px}
  .item:not(.attendance-row) {
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .cards {grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters {grid-template-columns:1fr}
  header {padding:15px}
  .export-fields {grid-template-columns:1fr}
  .mark-btn {width:37px;height:37px;min-width:37px}
}
</style>
</head>

<body>

<header>
  <div>
    <h1>College Journal</h1>
    <p id="subtitle"></p>
  </div>
  <select id="language" class="language" onchange="setLanguage(this.value)">
    <option value="ru">RU</option>
    <option value="ro">RO</option>

</header>

<div id="auth" class="auth hidden">

<div id="journal" class="hidden">

    <button data-page="home" id="navHome"></button>
    <button data-page="students" id="navStudents"></button>
    <button data-page="subjects" id="navSubjects"></button>
    <button data-page="history" id="navHistory"></button>

    <button onclick="logout()" id="logoutButton"></button>
  </nav>
  <main id="app"></main>
</div>

let language=localStorage.getItem("cj_language") || "ru";

function t(key) {
  return translations[language][key] || key;
}

function setLanguage(value) {
  language=value;
  localStorage.setItem("cj_language",value);
  document.documentElement.lang=value;
  updateStaticText();
  render();
}

function updateStaticText() {
  document.getElementById("language").value=language;
  document.getElementById("subtitle").textContent=t("subtitle");
  document.getElementById("loginTitle").textContent=t("login");
  document.getElementById("loginDescription").textContent=t("loginDescription");
  document.getElementById("passwordLabel").textContent=t("password");
  document.getElementById("loginButton").textContent=t("enter");

  const ids={
    navHome:"home",
    navStudents:"students",
    navSubjects:"subjects",
    navHistory:"history",
    navStats:"stats",
    logoutButton:"logout"
  };

  Object.entries(ids).forEach(([id,key])=>{
    document.getElementById(id).textContent=t(key);
  });
}

// ==========================================
// 3. СОСТОЯНИЕ
// ==========================================

let data={
  students:[],
  subjects:[],
  lessons:[],
  attendance:{}
};

let page="home";
let selectedSubject=null;
let selectedLesson=null;
let lessonReturnPage="history";
let selectedStudent="";
let historySubject="";
let historyFrom="";
let historyTo="";
let busy=false;

const app=document.getElementById("app");

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function localDate() {
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function button(text,action,primary=false) {
  return `<button class="${primary?"primary":""}"
    onclick="${action}">${text}</button>`;
}

function notify(message) {
  alert(message);
}

function setBusy(value) {
  busy=value;
  document.querySelectorAll("button").forEach(b=>{
    b.disabled=value;
  });
}

async function run(action) {
  if (busy) return;
  setBusy(true);
  try {
    await action();
  } catch(error) {
    console.error(error);
    notify(t("error")+": "+(error.message || error));
  } finally {
    setBusy(false);
  }
}

// ==========================================
// 4. АВТОРИЗАЦИЯ
// ==========================================

async function login(event) {
  event.preventDefault();

  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;
  const message=document.getElementById("authMessage");

  message.textContent=t("loginWait");

  const {error}=await db.auth.signInWithPassword({
    email,password
  });

  if (error) {
    message.textContent=error.message;
    return;
  }

  await startJournal();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

async function startJournal() {
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("journal").classList.remove("hidden");
  await loadData();
}

async function checkAuth() {
  if (
    !SUPABASE_URL.startsWith("https://") ||
    SUPABASE_URL.includes("ВСТАВЬ") ||
    !SUPABASE_KEY ||
    SUPABASE_KEY.includes("ВСТАВЬ")
  ) {
    document.getElementById("auth").classList.remove("hidden");
    document.getElementById("authMessage").textContent=t("wrongConfig");
    return;
  }

  const {data:result,error}=await db.auth.getSession();

  if (error) {
    notify(error.message);
    return;
  }

  if (result.session) {
    await startJournal();
  } else {
    document.getElementById("auth").classList.remove("hidden");
  }
}

// ==========================================
// 5. ЗАГРУЗКА ДАННЫХ
// ==========================================

async function loadData() {
  app.innerHTML=`<p class="muted">${t("loading")}</p>`;

  const [students,subjects,lessons,attendance]=await Promise.all([
    db.from("students").select("*").order("full_name"),
    db.from("subjects").select("*").order("name"),
    db.from("lessons").select("*").order("lesson_date"),
    db.from("attendance").select("*")
  ]);

  for (const result of [students,subjects,lessons,attendance]) {
    if (result.error) throw result.error;
  }

  data.students=students.data;
  data.subjects=subjects.data;
  data.lessons=lessons.data;
  data.attendance={};

  attendance.data.forEach(mark=>{
    if (!data.attendance[mark.lesson_id]) {
      data.attendance[mark.lesson_id]={};
    }
    data.attendance[mark.lesson_id][mark.student_id]=mark.is_present;
  });

  render();
}

// ==========================================
// 6. УЧЕНИКИ
// ==========================================

async function addStudent() {
  const name=prompt(t("enterStudent"));
  if (!name || !name.trim()) return;

  await run(async()=>{
    const {error}=await db.from("students").insert({
      full_name:name.trim()
    });
    if (error) throw error;
    await loadData();
  });
}

async function editStudent(id) {
  const student=data.students.find(s=>s.id===id);
  if (!student) return;

  const name=prompt(t("editStudent"),student.full_name);
  if (!name || !name.trim()) return;

  await run(async()=>{
    const {error}=await db.from("students")
      .update({full_name:name.trim()}).eq("id",id);
    if (error) throw error;
    await loadData();
  });
}

async function deleteStudent(id) {
  if (!confirm(t("confirmStudent"))) return;

  await run(async()=>{
    const {error:markError}=await db.from("attendance")
      .delete().eq("student_id",id);
    if (markError) throw markError;

    const {error}=await db.from("students")
      .delete().eq("id",id);
    if (error) throw error;

    if (selectedStudent===id) selectedStudent="";
    await loadData();
  });
}

// ==========================================
// 7. ПРЕДМЕТЫ
// ==========================================

async function addSubject() {
  const name=prompt(t("enterSubject"));
  if (!name || !name.trim()) return;

  await run(async()=>{
    const {error}=await db.from("subjects").insert({
      name:name.trim()
    });
    if (error) throw error;
    await loadData();
  });
}

async function editSubject(id) {
  const subject=data.subjects.find(s=>s.id===id);
  if (!subject) return;

  const name=prompt(t("editSubject"),subject.name);
  if (!name || !name.trim()) return;

  await run(async()=>{
    const {error}=await db.from("subjects")
      .update({name:name.trim()}).eq("id",id);
    if (error) throw error;
    await loadData();
  });
}

async function deleteSubject(id) {
  if (!confirm(t("confirmSubject"))) return;

  await run(async()=>{
    const lessons=data.lessons.filter(l=>l.subject_id===id);

    for (const lesson of lessons) {
      const {error:markError}=await db.from("attendance")
        .delete().eq("lesson_id",lesson.id);
      if (markError) throw markError;

      const {error:lessonError}=await db.from("lessons")
        .delete().eq("id",lesson.id);
      if (lessonError) throw lessonError;
    }

    const {error}=await db.from("subjects")
      .delete().eq("id",id);
    if (error) throw error;

    selectedSubject=null;
    selectedLesson=null;
    await loadData();
  });
}

// ==========================================
// 8. ЗАНЯТИЯ
// ==========================================

async function addLesson() {
  if (!selectedSubject) return;

  const previous=data.lessons.filter(
    l=>l.subject_id===selectedSubject
  );

  const number=previous.length
    ? Math.max(...previous.map(l=>l.lesson_number))+1
    : 1;

  await run(async()=>{
    const {data:lesson,error}=await db.from("lessons")
      .insert({
        subject_id:selectedSubject,
        lesson_number:number,
        lesson_date:localDate()
      })
      .select()
      .single();

    if (error) throw error;

    selectedLesson=lesson.id;
    lessonReturnPage="subject";
    page="lesson";
    await loadData();
  });
}

async function changeDate(value) {
  if (!value || !selectedLesson) return;

  await run(async()=>{
    const {error}=await db.from("lessons")
      .update({lesson_date:value}).eq("id",selectedLesson);

    if (error) throw error;

    const lesson=data.lessons.find(l=>l.id===selectedLesson);
    if (lesson) lesson.lesson_date=value;

    render();
  });
}

async function deleteLesson(id) {
  if (!confirm(t("confirmLesson"))) return;

  await run(async()=>{
    const {error:markError}=await db.from("attendance")
      .delete().eq("lesson_id",id);
    if (markError) throw markError;

    const {error}=await db.from("lessons")
      .delete().eq("id",id);
    if (error) throw error;

    selectedLesson=null;
    await loadData();
  });
}

// ==========================================
// 9. ПОСЕЩАЕМОСТЬ
// ==========================================

async function setAttendance(studentId,value) {
  if (busy || !selectedLesson) return;

  const current=data.attendance[selectedLesson]?.[studentId];

  // Повторное нажатие снимает отметку
  const newValue=
    (value==="present" && current===true) ||
    (value==="absent" && current===false)
      ? "none"
      : value;

  await run(async()=>{

    if (newValue==="none") {
      const {error}=await db.from("attendance")
        .delete()
        .eq("lesson_id",selectedLesson)
        .eq("student_id",studentId);

      if (error) throw error;

      if (data.attendance[selectedLesson]) {
        delete data.attendance[selectedLesson][studentId];
      }

    } else {
      const {error}=await db.from("attendance")
        .upsert({
          lesson_id:selectedLesson,
          student_id:studentId,
          is_present:newValue==="present"
        },{onConflict:"lesson_id,student_id"});

      if (error) throw error;

      if (!data.attendance[selectedLesson]) {
        data.attendance[selectedLesson]={};
      }

      data.attendance[selectedLesson][studentId]=
        newValue==="present";
    }

    // Обновляем только строку ученика.
    // Вся страница остаётся на месте.
    const row=document.getElementById(
      "attendance-row-"+studentId
    );

    if (row) {
      const mark=data.attendance[selectedLesson]?.[studentId];

      const presentButton=row.querySelector(".present-btn");
      const absentButton=row.querySelector(".absent-btn");
      const status=row.querySelector(".attendance-status");

      presentButton.classList.toggle("active",mark===true);
      absentButton.classList.toggle("active",mark===false);

      status.textContent=
        mark===true ? t("present") :
        mark===false ? t("absent") :
        t("unmarked");

      status.className=
        "small attendance-status "+
        (mark===true?"present":
         mark===false?"absent":"");
    }
  });
}

// ==========================================
// 10. ПЕРСОНАЛЬНАЯ СТАТИСТИКА
// ==========================================

function studentStats(studentId,subjectId=null) {
  const lessons=data.lessons.filter(l=>
    !subjectId || l.subject_id===subjectId
  );

  let present=0;
  let absent=0;
  let marked=0;

  const absences=[];
  const presences=[];

  lessons.forEach(lesson=>{
    const mark=data.attendance[lesson.id]?.[studentId];

    if (mark===undefined) return;

    const subject=data.subjects.find(
      s=>s.id===lesson.subject_id
    );

    const record={
      date:lesson.lesson_date,
      number:lesson.lesson_number,
      subject:subject?.name || "",
      lessonId:lesson.id
    };

    marked++;

    if (mark===true) {
      present++;
      presences.push(record);
    } else {
      absent++;
      absences.push(record);
    }
  });

  return {
    present,
    absent,
    marked,
    percent:marked ? Math.round(present/marked*100) : 0,
    absences,
    presences
  };
}

function applyHistoryFilters() {
  historySubject=document.getElementById("historySubject").value;
  historyFrom=document.getElementById("historyFrom").value;
  historyTo=document.getElementById("historyTo").value;
  render();
}

function resetHistoryFilters() {
  historySubject="";
  historyFrom="";
  historyTo="";
  render();
}

function filteredLessons() {
  return data.lessons.filter(l=>{
    if (historySubject && l.subject_id!==historySubject) return false;
    if (historyFrom && l.lesson_date<historyFrom) return false;
    if (historyTo && l.lesson_date>historyTo) return false;
    return true;
  }).sort((a,b)=>
    b.lesson_date.localeCompare(a.lesson_date) ||
    b.lesson_number-a.lesson_number
  );
}

function exportExcel() {

  );
}

// ==========================================
// 14. EXCEL — ЭКСПОРТ ПО ПРЕДМЕТУ
// ==========================================

function exportSubjectExcel(subjectId,mode) {
  if (typeof XLSX==="undefined") {
    notify(t("error")+": Excel library is not loaded.");
    return;
  }

  const subject=data.subjects.find(s=>s.id===subjectId);
  if (!subject) return;

  let from="";
  let to="";
  let periodName="all";

  if (mode==="month") {
    const month=document.getElementById("subjectExportMonth")?.value;

    if (!month) {
      notify(t("selectMonth"));
      return;
    }

    from=month+"-01";

    const [year,monthNumber]=month.split("-").map(Number);
    const lastDay=new Date(year,monthNumber,0).getDate();

    to=month+"-"+String(lastDay).padStart(2,"0");
    periodName=month;

  } else if (mode==="custom") {
    from=document.getElementById("subjectExportFrom")?.value || "";
    to=document.getElementById("subjectExportTo")?.value || "";

    if (!from || !to) {
      notify(t("customInfo"));
      return;
    }

    if (from>to) {
      notify(t("invalidPeriod"));
      return;
    }

    periodName=from+"_to_"+to;
  }

  const lessons=data.lessons
    .filter(l=>{
      if (l.subject_id!==subjectId) return false;
      if (from && l.lesson_date<from) return false;
      if (to && l.lesson_date>to) return false;
      return true;
    })
    .slice()
    .sort((a,b)=>
      a.lesson_date.localeCompare(b.lesson_date) ||
      a.lesson_number-b.lesson_number
    );

  if (!lessons.length) {
    notify(t("noLessonsPeriod"));
    return;
  }

  const detailsRows=[[
    t("subject"),
    t("number"),
    t("date"),
    t("student"),
    t("attendance")
  ]];

  const summaryRows=[[
    t("student"),
    t("totalLessons"),
    t("totalPresent"),
    t("totalAbsent"),
    t("totalUnmarked"),
    t("percent")
  ]];

  data.students.forEach(student=>{
    let present=0;
    let absent=0;
    let unmarked=0;

    lessons.forEach(lesson=>{
      const mark=data.attendance[lesson.id]?.[student.id];

      let status;

      if (mark===true) {
        present++;
        status=t("excelPresent");
      } else if (mark===false) {
        absent++;
        status=t("excelAbsent");
      } else {
        unmarked++;
        status=t("excelNone");
      }

      detailsRows.push([
        subject.name,
        lesson.lesson_number,
        lesson.lesson_date,
        student.full_name,
        status
      ]);
    });

    const percent=(present+absent)
      ? Math.round(present/(present+absent)*100)
      : 0;

    summaryRows.push([
      student.full_name,
      lessons.length,
      present,
      absent,
      unmarked,
      percent+"%"
    ]);
  });

  const workbook=XLSX.utils.book_new();

  const detailsSheet=XLSX.utils.aoa_to_sheet(detailsRows);
  detailsSheet["!cols"]=[
    {wch:25},
    {wch:14},
    {wch:16},
    {wch:25},
    {wch:20}
  ];

  const summarySheet=XLSX.utils.aoa_to_sheet(summaryRows);
  summarySheet["!cols"]=[
    {wch:25},
    {wch:17},
    {wch:17},
    {wch:17},
    {wch:17},
    {wch:17}
  ];

  XLSX.utils.book_append_sheet(
    workbook,
    detailsSheet,
    t("detailsSheet")
  );

  XLSX.utils.book_append_sheet(
    workbook,
    summarySheet,
    t("summarySheet")
  );

  const filename=subject.name.replace(/[^\p{L}\p{N}-]/gu,"_");

  XLSX.writeFile(
    workbook,
    "College-Journal-"+filename+"-"+periodName+".xlsx"
  );
}

    </div>

    <div class="card">
      <b>${t("attendance")}</b>
      <div class="progress">
        <div style="width:${st.percent}%"></div>
      </div>
      <span class="small">${st.percent}%</span>
    </div>

    <h3>${t("subjectStats")}</h3>
    ${subjectBlocks || `<p class="muted">${t("noSubjects")}</p>`}

    <h3>${t("absenceHistory")}</h3>

    <div class="card">
      <strong>${st.absent}</strong>
      <span class="muted">${t("absences")}</span>

      <div class="actions">
        ${button(t("viewAbsences"),"openAbsences()",true)}
      </div>
    </div>

    <h3>${t("presenceHistory")}</h3>
    ${recordList(st.presences)}

    <div class="actions">
      ${button(t("export"),"exportExcel()",true)}
    </div>
  `;
}

function openAbsences() {
  if (!selectedStudent) return;
  page="absences";
  render();
}

// ==========================================
// 17. ОКНО ЗАНЯТИЯ
// ==========================================

function lessonView() {
  const lesson=data.lessons.find(l=>l.id===selectedLesson);

  if (!lesson) {
    page=lessonReturnPage || "history";
    render();
    return "";
  }

  const subject=data.subjects.find(s=>s.id===lesson.subject_id);
  const marks=data.attendance[lesson.id] || {};

  return `
    ${button(t("back"),"backFromLesson()")}

    <h2>${safe(subject?.name || "")}</h2>

    <div class="card">
      <h3>${t("number")} ${lesson.lesson_number}</h3>

      <label>${t("date")}</label>
      <input type="date"
        value="${safe(lesson.lesson_date)}"
        onchange="changeDate(this.value)">

      <h3>${t("marks")}</h3>

      ${data.students.map((s,i)=>{
        const mark=marks[s.id];

        const label=mark===true ? t("present") :
          mark===false ? t("absent") : t("unmarked");

        return `
          <div class="item attendance-row"
               id="attendance-row-${s.id}">

            <div class="attendance-name">
              <b>${i+1}. ${safe(s.full_name)}</b>

              <div class="small attendance-status ${
                mark===true?"present":
                mark===false?"absent":""
              }">${label}</div>
            </div>

            <div class="attendance-controls">

              <button
                type="button"
                class="mark-btn present-btn ${
                  mark===true?"active":""
                }"
                title="${t("present")}"
                aria-label="${t("present")}"
                onclick="setAttendance('${s.id}','present')">
                ✓
              </button>

              <button
                type="button"
                class="mark-btn absent-btn ${
                  mark===false?"active":""
                }"
                title="${t("absent")}"
                aria-label="${t("absent")}"
                onclick="setAttendance('${s.id}','absent')">
                ✕
              </button>

            </div>
          </div>
        `;
      }).join("") || `<p class="muted">${t("noStudents")}</p>`}
    </div>
  `;
}

// ==========================================
// 18. ЗАПУСК
// ==========================================

document.querySelectorAll("nav button[data-page]").forEach(b=>{
  b.addEventListener("click",()=>go(b.dataset.page));
});

db.auth.onAuthStateChange((event,session)=>{
  if (event==="SIGNED_OUT") {
    data={
      students:[],
      subjects:[],
      lessons:[],
      attendance:{}
    };

    document.getElementById("journal").classList.add("hidden");
    document.getElementById("auth").classList.remove("hidden");
  }
});

updateStaticText();
checkAuth();

</script>
</body>
</html>
